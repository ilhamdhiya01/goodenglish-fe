name: CI

on:
  workflow_call:
  pull_request:
    branches: [development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        env:
          # routes.ts falls back to "" without this, so the build would pass
          # while producing a bundle that calls the frontend origin.
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Builds and serves the app itself (playwright.config.ts); every backend
      # call is mocked in the browser, so no API server is needed.
      - name: E2E
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
